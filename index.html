<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Scrapclaw</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; height: 100dvh; overflow: hidden;
    background: #0b0e14;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #f5e9d0;
  }
  #wrap { position: fixed; inset: 0; }
  canvas { position: absolute; inset: 0; display: block; touch-action: none; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: flex-start; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 0 10px;
    pointer-events: none; z-index: 5;
  }
  .chip {
    background: rgba(10, 14, 20, .78); border: 1px solid rgba(255, 190, 80, .35);
    border-radius: 10px; padding: 6px 11px; font-size: 15px; font-weight: 700;
    letter-spacing: .02em; white-space: nowrap;
  }
  .chip small { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: .14em; color: #ffb84d; }
  .chip b { font-size: 17px; }
  #titleChip { background: rgba(60, 38, 4, .85); border-color: rgba(255, 184, 77, .7); }
  #muteBtn {
    pointer-events: auto; margin-left: auto; width: 42px; height: 42px; border-radius: 10px;
    border: 1px solid rgba(255, 190, 80, .35); background: rgba(10, 14, 20, .78);
    color: #f5e9d0; font-size: 19px; line-height: 1; cursor: pointer;
  }
  #objective {
    position: absolute; top: calc(64px + env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; font-size: 16.5px; font-weight: 700; color: #ffe9bd;
    text-shadow: 0 2px 8px rgba(0,0,0,.85); pointer-events: none; z-index: 5; padding: 0 12px;
  }
  #buttons {
    position: absolute; right: 10px; bottom: 0; z-index: 6;
    display: flex; align-items: flex-end; gap: 10px;
    padding-bottom: 34px;
    padding-bottom: max(34px, calc(10px + env(safe-area-inset-bottom)));
  }
  .bigbtn {
    pointer-events: auto; border: 2px solid rgba(0,0,0,.45); border-radius: 16px;
    font-weight: 900; letter-spacing: .03em; cursor: pointer; color: #14100a;
    box-shadow: 0 6px 18px rgba(0,0,0,.5);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
  }
  #clawBtn {
    width: 128px; height: 92px; font-size: 21px;
    background: linear-gradient(180deg, #ffc95e, #f39c12);
  }
  #clawBtn.held { background: linear-gradient(180deg, #f39c12, #d97b06); transform: translateY(2px); }
  #flatBtn {
    width: 108px; height: 68px; font-size: 16px;
    background: linear-gradient(180deg, #8d99ae, #5c6779); color: #e8ecf3; opacity: .45;
  }
  #flatBtn.awake {
    opacity: 1; background: linear-gradient(180deg, #ef6461, #c93a36); color: #fff;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.055); } }
  #nextBtn {
    width: 108px; height: 68px; font-size: 16px; display: none;
    background: linear-gradient(180deg, #7bd88f, #3da35d); color: #08130b;
  }
  #hint {
    position: absolute; left: 12px; bottom: 0; z-index: 5; max-width: 300px;
    padding-bottom: 34px;
    padding-bottom: max(34px, calc(10px + env(safe-area-inset-bottom)));
    font-size: 12.5px; line-height: 1.45; color: rgba(245, 233, 208, .66);
    text-shadow: 0 1px 4px rgba(0,0,0,.9); pointer-events: none;
  }
  @media (max-width: 560px) {
    #hint { display: none; }
    .chip { font-size: 13px; padding: 5px 8px; }
    .chip b { font-size: 15px; }
    #clawBtn { width: 112px; height: 84px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="chip" id="titleChip">SCRAPCLAW</div>
    <div class="chip"><small>SCRAP</small><b id="scrapVal">0</b> kg</div>
    <div class="chip"><small>STRIPPED</small><b id="stripVal">0</b>%</div>
    <div class="chip"><small>CRUSHED</small><b id="crushVal">0</b></div>
    <button id="muteBtn" title="Sound on or off">🔊</button>
  </div>
  <div id="objective">Strip it. Tear parts off and feed the bin.</div>
  <div id="hint">Drag anywhere: the claw follows your finger's movement.<br>Hold CLAW to grip and bite.<br>Pull hard to tear parts free.</div>
  <div id="buttons">
    <button class="bigbtn" id="nextBtn">NEXT CAR</button>
    <button class="bigbtn" id="flatBtn">FLATTEN</button>
    <button class="bigbtn" id="clawBtn">CLAW</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   SCRAPCLAW, Stage 2. A junkyard claw simulator.
   Sedans, pickups, vans, hatchbacks and motorcycles roll in.
   Tear them apart, feed the bin, crush the husk, bring in
   the next one.
   ============================================================ */
const { Engine, Bodies, Body, Composite, Constraint, Vector } = Matter;

const W = 1280, H = 720, GROUND_Y = 664;
const SHOULDER = { x: 228, y: 462 };
const L1 = 368, L2 = 352;                       // boom and stick lengths
const BIN = { x: 706, y: 592, w: 224, h: 76 };  // scrap bin zone
const PAD = { x0: 962, x1: 1150, cx: 1056 };    // flattener pad zone
const CAR_X = 560;                              // work spot
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const SHAKE_SCALE = REDUCED ? 0.5 : 1;

/* ---------- persistent totals ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("sc-" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sc-" + k, JSON.stringify(v)); } catch (e) {} }
};
let totalScrap = store.get("scrap", 0);
let carsCrushed = store.get("cars", 0);

/* ---------- audio: all synthesized ---------- */
const AudioSys = {
  ctx: null, master: null, muted: store.get("muted", false), hum: null, humGain: null,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.5;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) {
    this.muted = m; store.set("muted", m);
    if (this.master) this.master.gain.value = m ? 0 : 0.5;
  },
  noiseBuf(dur) {
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },
  burst(dur, filterType, freq, q, gain, when = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + when;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf(dur);
    const f = this.ctx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  },
  blip(type, f0, f1, dur, gain, when = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  clank(big = 1) {
    this.burst(0.14, "bandpass", 1500 + Math.random() * 700, 1.2, 0.5 * big);
    this.blip("square", 210 + Math.random() * 60, 70, 0.16, 0.22 * big);
    this.blip("square", 320 + Math.random() * 90, 110, 0.1, 0.12 * big, 0.02);
  },
  crack() {

  },
  shatter() {

  },
  crunch() {

    this.blip("sine", 68, 28, 0.55, 0.7);

  },
  clatter() {

      this.blip("square", 260 + Math.random() * 120, 120, 0.06, 0.1, i * 0.07);
    }
  },
  humStart() {
    if (!this.ctx || this.muted || this.hum) return;
    try {
      this.hum = this.ctx.createOscillator(); this.hum.type = "sawtooth"; this.hum.frequency.value = 52;
      const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 220;
      this.humGain = this.ctx.createGain(); this.humGain.gain.value = 0.0;
      this.humGain.gain.linearRampToValueAtTime(0.05, this.ctx.currentTime + 0.08);
      this.hum.connect(f); f.connect(this.humGain); this.humGain.connect(this.master);
      this.hum.start();
    } catch (e) { this.hum = null; }
  },
  humStop() {
    if (!this.hum) return;
    try {
      const h = this.hum, g = this.humGain;
      g.gain.linearRampToValueAtTime(0.0, this.ctx.currentTime + 0.07);
      setTimeout(() => { try { h.stop(); } catch (e) {} }, 120);
    } catch (e) {}

  }
};

<script>

  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 240;
    particles.push({ type: "shard", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 130, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 14, life: 0.85 + Math.random() * 0.5, t: 0, size: 3 + Math.random() * 6, color: "#bfe0f5" });

function addFloater(x, y, text, color = "#ffd97a") { floaters.push({ x, y, text, color, t: 0, life: 1.25 }); }
function stepParticles(dt) {
  for (const p of particles) {
    p.t += dt;
    p.vy += (p.type === "dust" ? -12 : 620) * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.rot !== undefined) p.rot += p.vr * dt;
    if (p.y > GROUND_Y - 2 && p.type !== "dust") { p.y = GROUND_Y - 2; p.vy *= -0.3; p.vx *= 0.7; }

/* ---------- claw arm: 2-bone IK ---------- */
function solveIK(tx, ty) {
  let dx = tx - SHOULDER.x, dy = ty - SHOULDER.y;
  let d = Math.hypot(dx, dy) || 1;
  const maxD = L1 + L2 - 2, minD = Math.abs(L1 - L2) + 40;
  if (d > maxD) { dx *= maxD / d; dy *= maxD / d; d = maxD; }
  if (d < minD) { dx *= minD / d; dy *= minD / d; d = minD; }
  wrist.x = SHOULDER.x + dx; wrist.y = SHOULDER.y + dy;
  const a = Math.acos(Math.min(1, Math.max(-1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
  const base = Math.atan2(dy, dx), ea = base - a;
  elbow.x = SHOULDER.x + L1 * Math.cos(ea);
  elbow.y = SHOULDER.y + L1 * Math.sin(ea);

  clawTip.y = wrist.y + Math.sin(clawAng) * 46;

function clawPoint() { return { x: wrist.x + Math.cos(clawAng) * 30, y: wrist.y + Math.sin(clawAng) * 30 }; }

/* ---------- view transform ---------- */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let view = { s: 1, ox: 0, oy: 0 };
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(window.innerWidth * dpr);
  canvas.height = Math.floor(window.innerHeight * dpr);
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  view.s = Math.min(canvas.width / W, canvas.height / H);
  view.ox = (canvas.width - W * view.s) / 2;
  view.oy = (canvas.height - H * view.s) / 2;
}
window.addEventListener("resize", resize);
resize();
function toWorld(e) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

/* ---------- input ---------- */

}

canvas.addEventListener("pointercancel", endDrag);

const clawBtn = document.getElementById("clawBtn");
function clawDown(e) {

}
function clawUp(e) {

clawBtn.addEventListener("contextmenu", e => e.preventDefault());

const muteBtn = document.getElementById("muteBtn");
function syncMute() { muteBtn.textContent = AudioSys.muted ? "🔇" : "🔊"; }
muteBtn.addEventListener("click", () => { AudioSys.init(); AudioSys.setMuted(!AudioSys.muted); syncMute(); });

/* ---------- grip, bite, tear ---------- */
function tryGrip() {
  if (grip) return;
  const cp = clawPoint();
  let best = null, bestScore = Infinity;
  for (const p of parts) {
    if (!p.body || p.glass || p.isSlab) continue;
    if (p.isShell && rigLocked) continue; // the rig holds the husk; it cannot be gripped or towed until release
    const d = Math.hypot(p.body.position.x - cp.x, p.body.position.y - cp.y);
    if (d >= p.gripR + 34) continue;
    let score = d - p.gripR;
    if (p.name === "engine" && hoodAttached()) score += 18;
    if (score < bestScore) { best = p; bestScore = score; }
  }
  if (best) {
    const local = { x: cp.x - best.body.position.x, y: cp.y - best.body.position.y };
    const c = Constraint.create({ pointA: { x: cp.x, y: cp.y }, bodyB: best.body, pointB: local, length: 0, stiffness: best.gripK, damping: 0.12 });
    Composite.add(world, c);

function releaseGrip() {

}
function tryBite() {
  const cp = clawPoint();
  for (const p of parts) {
    if (!p.glass || !p.attached || !p.body) continue;
    const d = Math.hypot(p.body.position.x - cp.x, p.body.position.y - cp.y);
    if (d < p.gripR + 32) {

      if (p.hp <= 0) shatterGlass(p);
      else { p.cracked = true; AudioSys.crack(); addShake(3); spawnSparks(p.body.position.x, p.body.position.y, 7, "#cfe8ff"); }

    if (q === p) continue;
    const keep = [];
    for (const j of q.joints) { if (j.other === p.body) removeJoint(j); else keep.push(j); }
    q.joints = keep;

    addShake(Math.min(4 + p.threshold * 0.11, 13));
    spawnSparks(p.body.position.x, p.body.position.y, 14);

}

  for (const j of p.joints) removeJoint(j);
  p.joints = [];
  for (const q of parts) {
    if (q === p) continue;
    const keep = [];
    for (const j of q.joints) { if (j.other === p.body) removeJoint(j); else keep.push(j); }

  detachPart(p, false);

function strainCheck() {

  // so a violent pull tears where a gentle drag only tows
  let yank = 0;

    const cp = clawPoint();
    const gp = { x: grip.part.body.position.x + grip.c.pointB.x, y: grip.part.body.position.y + grip.c.pointB.y };
    yank = Math.hypot(cp.x - gp.x, cp.y - gp.y) * 0.9;

    const thr = p.engineThr ? (hoodAttached() ? p.engineThr[0] : p.engineThr[1]) : p.threshold;
    const boost = (grip && grip.part === p) ? yank : 0;

      // the live anchor is simply body position plus stored point
      const pa = { x: j.bodyA.position.x + j.c.pointA.x, y: j.bodyA.position.y + j.c.pointA.y };
      const pb = { x: p.body.position.x + j.c.pointB.x, y: p.body.position.y + j.c.pointB.y };
      const strain = Math.hypot(pa.x - pb.x, pa.y - pb.y) - j.rest + boost;

    if (grip && grip.part === p) continue;
    const b = p.body.position;
    if (b.x > BIN.x && b.x < BIN.x + BIN.w && b.y > BIN.y && b.y < BIN.y + BIN.h + 26) {

      p.gone = true;

/* ---------- dismantling rig and world bounds ---------- */
function releaseRig() {
  if (!rigLocked) return;
  rigLocked = false;
  rigTarget = 1;
  if (shellPart && shellPart.body) {
    Body.setStatic(shellPart.body, false); // restores the shell's mass and inertia
    spawnDust(shellPart.body.position.x - 130, GROUND_Y - 6, 4, 70);
    spawnDust(shellPart.body.position.x + 130, GROUND_Y - 6, 4, 70);

}
function rigCheck() {
  // at 80% stripped the rig lets go: the husk is towable from here on

}

  // backstop: nothing leaves the yard, ever. The walls and the
  // full-width ground handle normal play; anything found outside
  // is recovered here.
  for (const p of parts) {
    if (!p.body || p.isSlab) continue;
    const b = p.body.position;
    if (b.x > -80 && b.x < 1360 && b.y < 880) continue;
    if (p.isShell || p.attached) {
      // shift the whole remaining car back inside, welds intact
      let dx = 0, dy = 0;
      if (b.x < 60) dx = 60 - b.x; else if (b.x > 1220) dx = 1220 - b.x;
      if (b.y > 880) dy = 300 - b.y;
      for (const q of parts) {
        if (!q.body || q.isSlab || (!q.attached && !q.isShell)) continue;
        Body.setPosition(q.body, { x: q.body.position.x + dx, y: q.body.position.y + dy });
        Body.setVelocity(q.body, { x: 0, y: 0 });
        Body.setAngularVelocity(q.body, 0);
      }
      if (grip) releaseGrip();
      spawnDust(b.x + dx, Math.min(b.y + dy, GROUND_Y - 8), 6, 80);
    } else {
      if (grip && grip.part === p) releaseGrip();
      Body.setPosition(p.body, { x: CAR_X + (Math.random() * 120 - 60), y: 280 });
      Body.setVelocity(p.body, { x: 0, y: 0 });
      Body.setAngularVelocity(p.body, 0);
      spawnDust(p.body.position.x, p.body.position.y, 6, 60);
    }
  }
}

<script>
/* ---------- drawing helpers ---------- */
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f < 1) { r *= f; g *= f; b *= f; } else { r += (255 - r) * (f - 1); g += (255 - g) * (f - 1); b += (255 - b) * (f - 1); }
  return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
}
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------- car factory ---------- */
function makePart(name, body, opts, home) {
  const p = Object.assign({
    name, body, kg: 0, attached: true, joints: [], threshold: 55,
    glass: false, hp: 0, cracked: false, gripR: 40, gripK: 0.85,
    isShell: false, isSlab: false, gone: false, drawZ: 5, w: 0, h: 0, r: 0, color: "#888",
    kind: null, vtype: null, engineThr: null

  p.home = home || { x: body.position.x, y: body.position.y };
  parts.push(p);
  return p;
}
function addJoint(part, otherBody, ax, ay, stiff) {
  // matter 0.19 constraint points are world-frame offsets that the
  // solver maintains by rotating them with the body's delta angle.
  // Pass raw offsets, never pre-rotated locals, or welds drift.
  const pointA = { x: ax - otherBody.position.x, y: ay - otherBody.position.y };
  const pointB = { x: ax - part.body.position.x, y: ay - part.body.position.y };
  const c = Constraint.create({ bodyA: otherBody, pointA, bodyB: part.body, pointB, length: 0, stiffness: stiff || 0.72, damping: 0.1 });
  Composite.add(world, c);
  part.joints.push({ c, bodyA: otherBody, pointA, pointB, rest: 0, other: otherBody });
}
function sloped(x1, y1, x2, y2, thick, opts) {
  const len = Math.hypot(x2 - x1, y2 - y1);
  return Bodies.rectangle((x1 + x2) / 2, (y1 + y2) / 2, len, thick, Object.assign({ angle: Math.atan2(y2 - y1, x2 - x1) }, opts));
}
/* ---------- vehicle specs ---------- */
/* Coordinates: dx is relative to the work-spot center CAR_X, dy is
   relative to GROUND_Y (negative is up). Rect and circle parts use
   dx, dy as their center; slope parts use dx1, dy1, dx2, dy2 as
   endpoints and thick as the bar thickness. Joints are weld points
   in the same relative frame, each [dx, dy] or [dx, dy, stiffness],
   and every joint welds the part to the shell. For slope parts w is
   the bar length and h the thickness, which is what the painter
   expects. engineThr is [covered, bare]: the strain threshold for
   the engine with the hood on and with it off. */
const VEHICLES = {
  sedan: {
    id: "sedan", label: "SEDAN", crushKg: 650,
    colors: ["#2f6db3", "#8c2f39", "#3f6212"],
    shell: { dx: 0, dy: -72, w: 368, h: 54, density: 0.0018 },
    parts: [
      { name: "wheel", shape: "circle", dx: 112, dy: -30, r: 30, kg: 28, thr: 78, gripR: 34, density: 0.002, z: 1, joints: [[112, -52, 0.92], [100, -22, 0.92]] },
      { name: "wheel", shape: "circle", dx: -112, dy: -30, r: 30, kg: 28, thr: 78, gripR: 34, density: 0.002, z: 1, joints: [[-112, -52, 0.92], [-100, -22, 0.92]] },
      { name: "engine", dx: 124, dy: -76, w: 78, h: 48, kg: 180, gripR: 46, gripK: 0.7, density: 0.004, engineThr: [150, 85], z: 3, joints: [[88, -80], [158, -80], [124, -58]] },

<script>
/* ---------- flatten sequence ---------- */
let awaitingNext = false;
let shellSquash = 1;
function strippedPct() { return Math.max(0, Math.min(100, Math.round(100 * strippedKg / totalStrippable))); }
function huskOnPad() {
  return !!(shellPart && shellPart.body && Math.abs(shellPart.body.position.x - PAD.cx) < 96 && shellPart.body.position.y > 520);
}
function plateTargetY() { return shellPart && shellPart.body ? shellPart.body.position.y - shellPart.h / 2 - 26 : 262; }
function startFlatten(instant) {
  if (flattenAnim || awaitingNext || !carLive || !shellPart || !shellPart.body) return false;
  if (strippedPct() < 80 || !huskOnPad()) return false;
  releaseGrip();
  rigLocked = false; rigTarget = 1;
  flattenAnim = { t: 0, crunched: false, instant: !!instant };
  Body.setStatic(shellPart.body, true);
  if (instant) {
    pressPlateY = plateTargetY();
    AudioSys.crunch();
    finishFlatten();
  }
  return true;
}
function finishFlatten() {
  const sh = shellPart;
  if (!sh || !sh.body) { flattenAnim = null; return; }
  const col = sh.color;
  for (const p of [...parts]) {
    if (p === sh || p.isSlab) continue;
    if (p.body && p.attached) { p.attached = false; removePartBody(p); p.gone = true; }
  }
  removePartBody(sh);
  parts = parts.filter(p => p !== sh);
  const idx = slabs.length;
  const slabW = Math.max(120, Math.round(sh.w * 0.84));
  const slabBody = Bodies.rectangle(262, GROUND_Y - 11 - idx * 23, slabW, 22, { isStatic: true });
  Composite.add(world, slabBody);
  const slab = { name: "slab", body: slabBody, kg: sh.kg, attached: false, joints: [], threshold: 0, glass: false, hp: 0, cracked: false, gripR: 0, gripK: 0, isShell: false, isSlab: true, gone: false, drawZ: 2, w: slabW, h: 22, r: 0, color: col, home: { x: 262, y: GROUND_Y - 11 - idx * 23 } };
  parts.push(slab); slabs.push(slab);
  if (slabs.length > 4) { const old = slabs.shift(); Composite.remove(world, old.body); parts = parts.filter(p => p !== old); }
  shellPart = null;
  totalScrap += sh.kg; store.set("scrap", totalScrap);
  carsCrushed++; store.set("cars", carsCrushed);
  addFloater(PAD.cx, 430, "+" + sh.kg + " kg CRUSHED", "#ffb84d");
  spawnDust(262, GROUND_Y - 24, 9, 100);
  addShake(10);
  flattenAnim = null; shellSquash = 1;
  awaitingNext = true;
}
document.getElementById("flatBtn").addEventListener("click", () => { AudioSys.init(); startFlatten(false); });
document.getElementById("nextBtn").addEventListener("click", () => {
  AudioSys.init();
  if (!awaitingNext) return;
  awaitingNext = false;
  spawnCar(true);
});

/* ---------- HUD ---------- */
const scrapEl = document.getElementById("scrapVal");
const stripEl = document.getElementById("stripVal");
const crushEl = document.getElementById("crushVal");
const objEl = document.getElementById("objective");
const flatBtn = document.getElementById("flatBtn");
const nextBtn = document.getElementById("nextBtn");
function setText(node, v) { if (node._v !== v) { node._v = v; node.textContent = v; } }
function updateHUD() {
  setText(scrapEl, String(totalScrap));
  setText(stripEl, String(strippedPct()));
  setText(crushEl, String(carsCrushed));
  let obj;
  const vLabel = currentSpec ? currentSpec.label : "SEDAN";
  if (carArriving) obj = "Incoming " + vLabel + ". Fresh metal rolling in.";
  else if (flattenAnim) obj = "Crushing.";
  else if (awaitingNext) obj = "Crushed flat. Next up: " + VEHICLES[peekNextType()].label + ". Bring it in.";
  else if (strippedPct() < 80) obj = "Strip the " + vLabel + ". Tear parts off and feed the bin.";
  else if (!huskOnPad()) obj = "Rig free. Drag the husk onto the flattener pad.";

<script>
/* ---------- main loop ---------- */
let graceUntil = 0;
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);

  last = now;

  const ks = 440 * dt;
  if (keys.ArrowLeft || keys.KeyA) targetPos.x -= ks;
  if (keys.ArrowRight || keys.KeyD) targetPos.x += ks;
  if (keys.ArrowUp || keys.KeyW) targetPos.y -= ks;
  if (keys.ArrowDown || keys.KeyS) targetPos.y += ks;
  clampTarget(targetPos);
  // heavy, damped claw pursuit
  {
    const dx = targetPos.x - clawPos.x, dy = targetPos.y - clawPos.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.01) {
      const move = Math.min(dist, Math.max(dist * Math.min(1, dt * 9), 0) + 1500 * dt * 0.4);
      const capped = Math.min(move, 1500 * dt);
      clawPos.x += dx / dist * capped;
      clawPos.y += dy / dist * capped;

      Body.setPosition(p.body, { x: p.home.x + arriveDX, y: p.home.y + dy });
      Body.setVelocity(p.body, { x: 0, y: 0 });

      // the shell stays static: the dismantling rig takes the car here
      rigLocked = true; rigTarget = 0;
      AudioSys.clank(0.5);
      carArriving = false; carLive = true;
      graceUntil = performance.now() + 1000;
      spawnDust(CAR_X - 150, GROUND_Y - 4, 7, 200);
    }
  }
  // physics, fixed step with accumulator
  acc += dt;
  let steps = 0;
  while (acc >= 1 / 60 && steps < 3) { Engine.update(engine, 1000 / 60); acc -= 1 / 60; steps++; }
  if (steps === 3) acc = 0;
  // cap runaway velocities
  for (const p of parts) {
    if (!p.body) continue;
    const v = p.body.velocity, sp = Math.hypot(v.x, v.y);
    if (sp > 58) Body.setVelocity(p.body, { x: v.x * 58 / sp, y: v.y * 58 / sp });
  }
  strainCheck();
  binCheck();
  rigCheck();
  boundsCheck();
  // flattener animation
  if (flattenAnim && !flattenAnim.instant) {
    flattenAnim.t += dt / 1.5;
    const t = flattenAnim.t;
    const pt = Math.min(1, Math.max(0, (t - 0.15) / 0.55));
    pressPlateY = 262 + (plateTargetY() - 262) * pt * pt;
    const sq = Math.min(1, Math.max(0, (t - 0.4) / 0.4));
    shellSquash = 1 - 0.82 * (sq * sq * (3 - 2 * sq));
    if (sq > 0.1 && Math.random() < 0.5 && shellPart && shellPart.body) spawnDust(shellPart.body.position.x, GROUND_Y - 10, 2, 260);
    if (t > 0.42 && !flattenAnim.crunched) {
      flattenAnim.crunched = true;
      AudioSys.crunch(); addShake(15);
      if (shellPart && shellPart.body) spawnDust(shellPart.body.position.x, GROUND_Y - 8, 14, 300);
    }
    if (t >= 1) finishFlatten();
  } else if (!flattenAnim) {
    pressPlateY += (262 - pressPlateY) * Math.min(1, dt * 2.6);
  }
  stepParticles(dt);
  rigAnim += Math.max(-dt / 0.4, Math.min(dt / 0.4, rigTarget - rigAnim));
  shake *= Math.exp(-5.2 * dt);
  if (shake < 0.04) shake = 0;
  draw();
  updateHUD();
}

/* ---------- test hook (invisible, for the harness) ---------- */
window.__SCRAPTEST = {
  ready() { return carLive && !!shellPart && !!shellPart.body; },
  state() {
    return {
      partsAttached: parts.filter(p => p.attached && !p.isShell && !p.isSlab).length,
      strippedPct: strippedPct(),
      carsCrushed,
      vehicle: currentType,
      nextVehicle: peekNextType(),
      totalScrap,
      strippableKg: totalStrippable,
      crushKg: currentSpec ? currentSpec.crushKg : 0,
      target: { x: targetPos.x, y: targetPos.y },
      clawOpen,
      rigLocked,
      shell: shellPart && shellPart.body ? { x: shellPart.body.position.x, y: shellPart.body.position.y, angle: shellPart.body.angle, isStatic: shellPart.body.isStatic } : null
    };
  },
  gripPart(name) {
    const part = parts.find(p => p.name === name);
    if (!part || !part.body) return false;
    targetPos = { x: part.body.position.x, y: part.body.position.y - 6 };
    clawPos = { x: targetPos.x, y: targetPos.y };
    solveIK(clawPos.x, clawPos.y);
    clawTarget = 0; clawOpen = 0;
    tryGrip();
    if (!grip) return false;
    targetPos = clampTarget({ x: part.body.position.x - 300, y: part.body.position.y - 330 });
    return true;
  },
  gripTest() { return this.gripPart("hood"); },
  flattenTest() {
    if (!shellPart || !shellPart.body) return false;
    for (const p of [...parts]) if (!p.isShell && !p.isSlab && p.attached) detachPart(p, false);
    Body.setPosition(shellPart.body, { x: PAD.cx, y: shellPart.home.y });
    Body.setVelocity(shellPart.body, { x: 0, y: 0 });
    Body.setAngle(shellPart.body, 0);
    return startFlatten(true);
  },
  spawnType(t) {
    if (!VEHICLES[t]) return false;
    for (const p of [...parts]) if (!p.isSlab && p.body) removePartBody(p);
    parts = parts.filter(p => p.isSlab);
    shellPart = null;
    awaitingNext = false; flattenAnim = null; shellSquash = 1; pressPlateY = 262;
    spawnCar(false, t);
    return currentType;
  }
};

/* ---------- boot ---------- */
spawnCar(false, "sedan");
solveIK(clawPos.x, clawPos.y);
requestAnimationFrame(frame);
const _q = new URLSearchParams(location.search);
if (_q.get("test") === "hood") setTimeout(() => window.__SCRAPTEST.gripTest(), 500);
if (_q.get("test") === "flat") setTimeout(() => window.__SCRAPTEST.flattenTest(), 500);
</script>
